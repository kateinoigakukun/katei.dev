<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1258.0" width="760" height="1258.0" role="img" aria-labelledby="chart-title chart-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="chart-title">WasmKit 0.3.1 to 0.4.0: run time on the wasmi-benchmarks execute suite</title>
<desc id="chart-desc">Horizontal bars, one group per benchmark case and one bar per machine, showing run time on 0.4.0 divided by run time on 0.3.1. Lower is faster; 1.0 would be no change. Every case is below 1.0 on all three machines. A dashed vertical line marks each machine's geomean over the suite: M4 Max 0.506, M2 Air 0.503, Ryzen 9 5900HX 0.523.</desc>
